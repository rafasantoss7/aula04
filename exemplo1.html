<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Formulário - Exemplo 1</title>
    </head>
    <body>
        <header>
            <h1 style="text-align: center;">Formulário de Cadastro</h1>
        </header>
        <!-- Conteúdo principal -->
        <main>
            <!-- Criação de formulário -->
             <!-- Action com # mantém o formulário na mesma página -->
            <!-- Método GET faz o envio pela URL da página -->
             <form action="#" method="POST">
                <!-- for define a qual input a label pertence -->
                <label for="nome">Nome: </label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome...">
                <br>
                <br>
                <!-- Segundo campo -->
                 <label for="idade">Idade: </label>
                 <input type="number" id="idade" name="idade" placeholder="Digite sua idade..." required>
                 <br>
                 <br>
                 <!-- Botão para enviar informações -->
                  <button type="submit">Enviar</button>
             </form>
        </main>
    </body>
</html>


<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4 - Inscrição em Curso</title>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Inscrição em Curso</h1>
    </header>

    <main>
        <form action="#" method="GET">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome..." required>
            <br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail..." required>
            <br><br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" pattern="[0-9]{2} [0-9]{5}-[0-9]{4}" required>
            <br><br>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço...">
            <br><br>

            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" name="dataNascimento" required>
            <br><br>

            <label>Gênero:</label>
            <br>

            <input type="radio" id="masculino" name="genero" value="masculino" required>
            <label for="masculino">Masculino</label>
            <br>

            <input type="radio" id="feminino" name="genero" value="feminino">
            <label for="feminino">Feminino</label>
            <br>

            <input type="radio" id="outro" name="genero" value="outro">
            <label for="outro">Outro</label>
            <br><br>

            <label for="escolaridade">Escolaridade:</label>
            <select id="escolaridade" name="escolaridade" required>
                <option value="" selected disabled>Selecione...</option>
                <option value="fundamental">Ensino Fundamental</option>
                <option value="medio">Ensino Médio</option>
                <option value="tecnico">Ensino Técnico</option>
                <option value="superior">Ensino Superior</option>
                <option value="pos">Pós-graduação</option>
            </select>
            <br><br>

            <label for="profissao">Profissão:</label>
            <input type="text" id="profissao" name="profissao" placeholder="Digite sua profissão...">
            <br><br>

            <label for="experiencia">Experiência Anterior:</label>
            <br>
            <textarea id="experiencia" name="experiencia" rows="4" cols="40" placeholder="Descreva suas experiências antigas..."></textarea>
            <br><br>

            <label for="motivacao">Motivação para o Curso:</label>
            <br>
            <textarea id="motivacao" name="motivacao" rows="4" cols="40" placeholder="Por que deseja fazer este curso?" required></textarea>
            <br><br>

            <label for="expectativas">Expectativas:</label>
            <br>
            <textarea id="expectativas" name="expectativas" rows="4" cols="40" placeholder="Quais são suas expectativas?" required></textarea>
            <br><br>

            <input type="checkbox" id="termos" name="termos" value="sim" required>
            <label for="termos">Aceito os Termos e Condições.</label>
            <br><br>

            <input type="checkbox" id="novidades" name="novidades" value="sim">
            <label for="novidades">Desejo receber novidades por e-mail.</label>
            <br><br>

            <label for="informatica">Nível de Conhecimento em Informática:</label>
            <select id="informatica" name="informatica" required>
                <option value="" selected disabled>Selecione...</option>
                <option value="basico">Básico</option>
                <option value="intermediario">Intermediário</option>
                <option value="avancado">Avançado</option>
            </select>
            <br><br>

            <label>Disponibilidade de Horário:</label>
            <br>

            <input type="checkbox" id="manha" name="horario[]" value="manha">
            <label for="manha">Manhã</label>
            <br>

            <input type="checkbox" id="tarde" name="horario[]" value="tarde">
            <label for="tarde">Tarde</label>
            <br>

            <input type="checkbox" id="noite" name="horario[]" value="noite">
            <label for="noite">Noite</label>
            <br><br>

            <label for="referencia">Referência de Amigos:</label>
            <input type="text" id="referencia" name="referencia" placeholder="Nome de quem indicou...">
            <br><br>

            <label for="hobbies">Hobbies:</label>
            <br>
            <textarea id="hobbies" name="hobbies" rows="3" cols="40" placeholder="Quais são seus hobbies?"></textarea>
            <br><br>

            <label for="estadoCivil">Estado Civil:</label>
            <select id="estadoCivil" name="estadoCivil" required>
                <option value="" selected disabled>Selecione...</option>
                <option value="solteiro">Solteiro(a)</option>
                <option value="casado">Casado(a)</option>
                <option value="divorciado">Divorciado(a)</option>
                <option value="viuvo">Viúvo(a)</option>
                <option value="outro">Outro</option>
            </select>
            <br><br>

            <label for="idiomas">Idiomas que Fala:</label>
            <br>

            <input type="checkbox" id="portugues" name="idiomas[]" value="portugues">
            <label for="portugues">Português</label>
            <br>

            <input type="checkbox" id="ingles" name="idiomas[]" value="ingles">
            <label for="ingles">Inglês</label>
            <br>

            <input type="checkbox" id="espanhol" name="idiomas[]" value="espanhol">
            <label for="espanhol">Espanhol</label>
            <br>

            <input type="checkbox" id="outroIdioma" name="idiomas[]" value="outro">
            <label for="outroIdioma">Outro</label>
            <br><br>

            <label for="pagamento">Método de Pagamento Preferido:</label>
            <select id="pagamento" name="pagamento" required>
                <option value="" selected disabled>Selecione...</option>
                <option value="pix">PIX</option>
                <option value="cartaoCredito">Cartão de crédito</option>
                <option value="cartaoDebito">Cartão de débito</option>
                <option value="boleto">Boleto bancário</option>
            </select>
            <br><br>

            <label for="observacoes">Outras Observações:</label>
            <br>
            <textarea id="observacoes" name="observacoes" rows="4" cols="40" placeholder="Escreva outras observações..."></textarea>
            <br><br>

            <button type="submit">Enviar Inscrição</button>

        </form>
    </main>
</body>
</html>

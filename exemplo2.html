<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Exemplo 2 - Formulário</title>
    </head>
    <body>
        <header>
            <h1 style="text-align: center;">Cadastro de Alunos</h1>
        </header>
        <main>
            <!--Formulário de cadastro  -->
            <form action="#" method="GET">
                <!-- nome do aluno -->
                 <label for="nome">Nome do aluno: </label>
                 <!-- Required torna o campo obrigatório -->
                 <input type="text" id="nome" name="nome" required>
                 <br>
                 <br>
                 <!-- Email do aluno -->
                  <label for="email">Email do Aluno: </label>
                  <input type="email" id="email" name="email" required>
                  <br>
                  <br>
                  <!-- Telefone do aluno -->
                  <label for="telefone">Telefone do aluno: </label>
                  <input type="tel" id="telefone" name="telefone" required>
                  <br>
                  <br>
                  <!-- Data de nascimento -->
                   <label for="data">Data de Nascimento: </label>
                   <input type="date" id="data" name="data" required>
                   <br>
                   <br>
                   <!-- Idade do aluno -->
                    <label for="idade">Idade: </label>
                    <input type="number" id="idade"name="data" required>
                    <br>
                    <br>
                      <label>Você estuda para as provas?</label>
                      <br>
                      <!--  Campo de escolha (apenas uma opção) -> type="radio"-->
                      <label for="sim">Sim, estudo</label>
                      <input type="radio" value="Sim" id="sim" name="pergunta">
                      <br>
                      <label for="nao">Não estudo</label>
                      <input type="radio" value="Não" id="nao" name="pergunta">
                      <br>
                      <br>
                      <!-- Campo range -->
                       <label for="progresso">O quanto você gosta das aulas do SENAI?</label>
                       <!-- Input do tipo range cria uma barra de progresso -->
                        <input type="range" id="progresso" name="progresso">
                        <br>
                        <br>
                        <!-- Input de cor -->
                         <label for="cor">Escolha sua cor favorita: </label>
                         <input type="color" name="cor" id="cor">
                         <br>
                         <br>
                         <label for="">Selecione a sua sala:</label>
                         <!-- Campo de seleção -->
                          <select name="opcao" id="opcao">
                            <!-- Criando opções pra selecionar -->
                            <option value="" selected disabled>Selecione...</option>
                            <option value="Sala Vermelha">Sala Vermelha</option>
                            <option value="Sala Azul">Sala Azul</option>
                            <option value="Sala Verde">Sala Verde</option>
                          </select>
                          <br>
                          <br>
                          <!-- Campo de arquivo -->
                           <label for="file">Envie sua foto: </label>
                           <input type="file" name="file" id="file">
                           <br>
                           <br>
                           <!-- Campo com textarea -->
                            <label for="observacoes">Observações: </label>
                            <textarea name="observacoes" id="observacoes" rows="8" cols="50">
                            </textarea>
                            <br>
                            <br>
                            <!-- Campo com checkbox -->
                             <input type="checkbox" id="termos" name="termos" value="termos">
                             <label for="termos">Li e concordo com os termos.</label>
                             <br>
                             <input type="checkbox" id="receberEmail" name="receberEmail" value="receberEmail">
                             <label for="receberEmail">Desejo receber e-mail de divulgação.</label>
                             <br>
                             <input type="checkbox" name="receberSMS" id="receberSMS" value="receberSMS">
                             <label for="receberSMS">Desejo receber SMS de divulgação.</label>
                             <br>
                             <br>
                    <!-- Botão de envio -->
                 <button type="submit">Enviar</button>
            </form>
        </main>
    </body>
</html>

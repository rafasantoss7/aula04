
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3 - Reserva em Restaurante</title>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Reserva em Restaurante</h1>
    </header>

    <main>
        <form action="#" method="GET">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome..." required>
            <br><br>

            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome..." required>
            <br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail..." required>
            <br><br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
            <br><br>

            <label for="pessoas">Número de Pessoas:</label>
            <input type="number" id="pessoas" name="pessoas" required>
            <br><br>

            <label for="data">Data da Reserva:</label>
            <input type="date" id="data" name="data" required>
            <br><br>

            <label for="horario">Horário da Reserva:</label>
            <input type="time" id="horario" name="horario" required>
            <br><br>

            <label>Preferências Alimentares:</label>
            <br>

            <input type="checkbox" id="vegetariano" name="preferencias[]" value="vegetariano">
            <label for="vegetariano">Vegetariano</label>
            <br>

            <input type="checkbox" id="vegano" name="preferencias[]" value="vegano">
            <label for="vegano">Vegano</label>
            <br>

            <input type="checkbox" id="semGluten" name="preferencias[]" value="semGluten">
            <label for="semGluten">Sem glúten</label>
            <br>

            <input type="checkbox" id="semLactose" name="preferencias[]" value="semLactose">
            <label for="semLactose">Sem lactose</label>
            <br><br>

            <label>Restrições Alimentares:</label>
            <br>

            <input type="checkbox" id="alergiaAmendoim" name="restricoes[]" value="amendoim">
            <label for="alergiaAmendoim">Alergia a amendoim</label>
            <br>

            <input type="checkbox" id="alergiaFrutosMar" name="restricoes[]" value="frutosMar">
            <label for="alergiaFrutosMar">Alergia a frutos do mar</label>
            <br>

            <input type="checkbox" id="alergiaLeite" name="restricoes[]" value="leite">
            <label for="alergiaLeite">Alergia a leite</label>
            <br>

            <input type="checkbox" id="outraRestricao" name="restricoes[]" value="outra">
            <label for="outraRestricao">Outra restrição</label>
            <br><br>

            <label for="comentarios">Comentários Adicionais:</label>
            <br>
            <textarea id="comentarios" name="comentarios" rows="5" cols="40" placeholder="Digite seus comentários..."></textarea>
            <br><br>

            <label for="evento">Tipo de Evento:</label>
            <select id="evento" name="evento" required>
                <option value="" selected disabled>Selecione...</option>
                <option value="aniversario">Aniversário</option>
                <option value="casamento">Casamento</option>
                <option value="negocios">Reunião de negócios</option>
                <option value="familia">Encontro familiar</option>
                <option value="romantico">Jantar romântico</option>
                <option value="outro">Outro</option>
            </select>
            <br><br>

            <label>Necessidades Especiais:</label>
            <br>

            <input type="checkbox" id="cadeirante" name="necessidades[]" value="acessibilidade">
            <label for="cadeirante">Acessibilidade para cadeira de rodas</label>
            <br>

            <input type="checkbox" id="criancas" name="necessidades[]" value="criancas">
            <label for="criancas">Cadeira para criança</label>
            <br>

            <input type="checkbox" id="idosos" name="necessidades[]" value="idosos">
            <label for="idosos">Acomodação para idosos</label>
            <br>

            <input type="checkbox" id="outraNecessidade" name="necessidades[]" value="outra">
            <label for="outraNecessidade">Outra necessidade</label>
            <br><br>

            <label for="assento">Preferência de Assento:</label>
            <select id="assento" name="assento" required>
                <option value="" selected disabled>Selecione...</option>
                <option value="interno">Área interna</option>
                <option value="externo">Área externa</option>
                <option value="janela">Perto da janela</option>
                <option value="indiferente">Sem preferência</option>
            </select>
            <br><br>

            <label for="codigo">Código Promocional:</label>
            <input type="text" id="codigo" name="codigo" required>
            <br><br>

            <label for="termos">Aceitar Termos e Condições:</label>
            <input type="checkbox" id="termos" name="termos" value="sim">
            <br><br>

            <label for="notificacoes">Receber Notificações:</label>
            <input type="checkbox" id="notificacoes" name="notificacoes" value="sim" required>
            <br><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade..." required>
            <br><br>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" placeholder="00000-000" required>
            <br><br>

            <label for="pais">País:</label>
            <select id="pais" name="pais" required>
                <option value="" selected disabled>Selecione...</option>
                <option value="brasil">Brasil</option>
                <option value="portugal">Portugal</option>
                <option value="argentina">Argentina</option>
                <option value="estadosUnidos">Estados Unidos</option>
                <option value="outro">Outro</option>
            </select>
            <br><br>

            <label for="referencia">Referência:</label>
            <input type="text" id="referencia" name="referencia" placeholder="Ponto de referência...">
            <br><br>

            <button type="submit">Reservar</button>
        </form>
    </main>
</body>
</html>
